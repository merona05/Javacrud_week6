<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 등록</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container">
  <h1 class="page-title">도서 관리 프로그램</h1>

  <div class="card">
    <div class="card-body p-4">
      <h2 class="h4 mb-4">새 도서 등록</h2>

      <form th:action="@{/books}"
            th:object="${bookRequest}"
            method="post">

        <div class="mb-3">
          <label for="title" class="form-label">도서명</label>
          <input type="text" id="title"
                 th:field="*{title}"
                 class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="author" class="form-label">저자</label>
          <input type="text" id="author"
                 th:field="*{author}"
                 class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">가격 (원)</label>
          <input type="number" id="price"
                 th:field="*{price}"
                 class="form-control" min="0" required>
        </div>

        <div class="mb-3">
          <label for="category" class="form-label">분류</label>
          <input type="text" id="category"
                 th:field="*{category}"
                 class="form-control" required>
        </div>

        <div class="mb-4">
          <label for="isbn" class="form-label">ISBN</label>
          <input type="text" id="isbn"
                 th:field="*{isbn}"
                 class="form-control" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            등록
          </button>
          <a th:href="@{/books}" class="btn btn-outline-secondary">
            취소
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
