
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2 class="mb-4">도서 수정</h2>

            <form th:action="@{/books/{id}/edit(id=${id})}"
                  th:object="${bookRequest}"
                  method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label">저자</label>
                    <input type="text" id="author" th:field="*{author}"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">가격</label>
                    <input type="number" id="price" th:field="*{price}"
                           class="form-control" min="0" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">분류</label>
                    <input type="text" id="category" th:field="*{category}"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="isbn" class="form-label">ISBN</label>
                    <input type="text" id="isbn" th:field="*{isbn}"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">수정 완료</button>
                <a th:href="@{/books}" class="btn btn-secondary">취소</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
